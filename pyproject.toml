[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "posthub"
version = "0.1.25"
description = "文思邮差 — Persistent, multi-channel notification relay"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx[socks]>=0.28,<1",
  "cryptography>=44", "apprise>=1.9,<2", "filelock>=3.17,<4",
  "msal>=1.39,<2", "qrcode[pil]>=8,<9", "tzdata>=2025.1", "websockets>=15,<18", "python-socks>=2.7,<3"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "aiosmtpd>=1.4,<2"]

[project.scripts]
posthub = "posthub.cli:main"

[tool.setuptools.packages.find]
include = ["posthub*"]

[tool.setuptools.package-data]
posthub = ["static/*", "static/icons/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
